name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies a short-lived OIDC token issued by
    # GitHub for this repo + workflow + environment, so no long-lived API token
    # is stored. The same mechanism signs a PEP 740 attestation for each
    # uploaded file, giving consumers verifiable build provenance.
    #
    # One-time setup on PyPI (Manage project -> Publishing) before this job can
    # work: owner juanmanueldaza, repository n3rv, workflow publish.yml,
    # environment pypi. Until that entry exists these uploads are rejected and
    # PYPI_TOKEN must stay in place as the fallback.
    environment: pypi
    permissions:
      id-token: write # required: mint the OIDC token

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1